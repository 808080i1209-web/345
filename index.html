<!-- switchTab FUNCTION 색상 부분만 수정 -->
<script>
function switchTab(tabId) {

    document.querySelectorAll('.tab-content').forEach(el =>
        el.classList.add('hidden')
    );

    document.getElementById(`tab-${tabId}`).classList.remove('hidden');

    document.querySelectorAll('.nav-btn').forEach(btn => {

        btn.classList.remove(
            'bg-blue-600',
            'text-white'
        );

        btn.classList.add(
            'text-slate-600',
            'hover:text-blue-700',
            'hover:bg-blue-50'
        );
    });

    document.getElementById(`btn-${tabId}`).classList.add(
        'bg-blue-600',
        'text-white'
    );

    document.getElementById(`btn-${tabId}`).classList.remove(
        'text-slate-600'
    );
}
</script>
